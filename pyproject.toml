[project]
name = "gengineer-pjdsc-2026"
version = "0.1.0"
description = "PJDSC 2026 entry: public health analytics with microcontroller and web application integration."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    # The analysis lane. The notebook template and every analysis notebook read
    # committed fixtures from data/samples/ with pandas, and CI runs the template
    # through nbmake, so pandas is needed at run time — not only for tooling.
    # The upper bound is deliberate: 2.x and 3.x have been exercised, and a future
    # major should be a decision made when the analysis lane is written, not a side
    # effect of a lock refresh. It is a bound, not a pin, because no analysis code
    # exists yet to justify freezing a minor version.
    "pandas>=2.2,<4",
]

[dependency-groups]
dev = [
    # Pinned exactly, not a floor: the version must match the ruff-pre-commit rev
    # in .pre-commit-config.yaml, or `ruff format --check` disagrees between a
    # contributor's machine and CI. Ruff >=0.14 also formats Python code blocks
    # inside Markdown, which changes what a whole-repo format check sees.
    "ruff==0.17.0",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "nbmake>=1.5",
    # Present so the documentable command `uv run nbstripout --verify <notebook>` works.
    # The pre-commit hook is the primary enforcement, but it cannot run on the maintainer's
    # machine (see the root AGENTS.md), so the CLI is the fallback an agent or human can
    # actually execute. Keeping the command runnable is worth one dev dependency.
    "nbstripout>=0.8",
    "pre-commit>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# specs/ holds frozen design records: the spec and the implementation plan as
# they were approved. Reformatting them would rewrite the historical record and
# bury the prose that decisions were argued from, so they are never formatted.
#
# notebooks/research/ is excluded for the same reason: those are the team's
# research records as they ran on Colab, and they are not maintained Python.
# Reformatting their code cells would rewrite the record and produce a diff
# nobody can review, for a directory CI never executes. The analysis notebooks
# (the direct children of notebooks/) are still linted and formatted.
extend-exclude = ["specs", "notebooks/research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

# Deliberately no [tool.coverage] section and no --cov in CI. This repository ships
# no importable package (spec §4.1 rule 2), so the only thing coverage could measure
# is the test suite itself, which reports a number that means nothing.

# This repository ships no importable package (spec §4.1 rule 2), so uv must not
# try to build or install the project itself. Without this, `uv sync` builds the
# root project and fails on `readme = "README.md"` until Task 2 creates that file.
[tool.uv]
package = false
